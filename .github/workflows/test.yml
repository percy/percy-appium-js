name: Test
on: 
  push:
  workflow_dispatch:
    inputs:
      branch:
        description: Used to set which branch of CLI to use for current run
        required: false
        type: string
        default: master
permissions:
  contents: read
jobs:
  test:
    name: Test (wdio ${{ matrix.wdio }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wdio: 8, node: 20 }
          - { wdio: 9, node: 22 }
          - { wdio: 10, node: 24 }
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        id: regex-match
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          text: ${{ github.event.inputs.branch }}
          regex: '^[a-zA-Z0-9_/\-]+$'
      - name: Break on invalid branch name
        run: exit 1
        if: ${{ github.event_name == 'workflow_dispatch' && steps.regex-match.outputs && steps.regex-match.outputs.match == '' }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/${{ hashFiles('**/yarn.lock') }}
          restore-keys: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/
      - name: Install dependencies (webdriverio 10, from yarn.lock)
        if: ${{ matrix.wdio == 10 }}
        run: yarn install --frozen-lockfile
      # yarn.lock holds webdriverio 10 only, so the older majors install the
      # exact versions in .github/wdio-versions.json: every run gets the same
      # packages. --ignore-engines: the lockfile's v10 packages need Node 22.19.
      - name: Install dependencies (webdriverio ${{ matrix.wdio }}, pinned)
        if: ${{ matrix.wdio != 10 }}
        env:
          WDIO: ${{ matrix.wdio }}
        run: >- # zizmor: ignore[adhoc-packages] exact versions from .github/wdio-versions.json
          yarn add --dev --ignore-engines
          $(node -p "require('./.github/wdio-versions.json')[process.env.WDIO].join(' ')")
      - name: Set up @percy/cli from git
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          cd /tmp
          git clone --branch "$BRANCH" --depth 1 https://github.com/percy/cli
          cd cli
          PERCY_PACKAGES=`find packages -mindepth 1 -maxdepth 1 -type d | sed -e 's/packages/@percy/g' | tr '\n' ' '`
          git log -1
          yarn
          yarn build
          yarn global:link
          # Expose the freshly built `percy` on PATH. yarn link symlinks the
          # package but not its bin, so `npx percy` would miss it and download
          # the unrelated public `percy`. Link is best-effort; PATH is what
          # makes percy resolvable.
          echo "$(yarn global bin)" >> "$GITHUB_PATH"
          export PATH="$(yarn global bin):$PATH"
          cd "$WORKSPACE"
          yarn remove @percy/cli >/dev/null 2>&1 || true
          yarn link `echo $PERCY_PACKAGES` >/dev/null 2>&1 || true
          percy --version
      - run: yarn test:coverage
        env:
          WDIO_MAJOR: ${{ matrix.wdio }}
