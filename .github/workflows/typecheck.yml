name: Typecheck
on: push
permissions:
  contents: read
jobs:
  typecheck:
    name: Typecheck (wdio ${{ matrix.wdio }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wdio: 8, node: 20 }
          - { wdio: 9, node: 22 }
          - { wdio: 10, node: 24 }
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"
      - uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/${{ hashFiles('**/yarn.lock') }}
          restore-keys: v1/${{ runner.os }}/node-${{ matrix.node }}/wdio-${{ matrix.wdio }}/
      - name: Install dependencies (webdriverio 10, from yarn.lock)
        if: ${{ matrix.wdio == 10 }}
        run: yarn install --frozen-lockfile
      # yarn.lock holds webdriverio 10 only, so the older majors install the
      # exact versions in .github/wdio-versions.json: every run gets the same
      # packages. --ignore-engines: the lockfile's v10 packages need Node 22.19.
      - name: Install dependencies (webdriverio ${{ matrix.wdio }}, pinned)
        if: ${{ matrix.wdio != 10 }}
        env:
          WDIO: ${{ matrix.wdio }}
        run: >- # zizmor: ignore[adhoc-packages] exact versions from .github/wdio-versions.json
          yarn add --dev --ignore-engines
          $(node -p "require('./.github/wdio-versions.json')[process.env.WDIO].join(' ')")
      - run: yarn test:types
